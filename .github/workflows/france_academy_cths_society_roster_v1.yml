name: France Academy CTHS society roster pilot v1

on:
  push:
    branches:
      - france-academy-cths-roster-v1
    paths:
      - scripts/france_academy_cths_society_roster_v1.py
      - .github/workflows/france_academy_cths_society_roster_v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cths-secondary-roster-pilot:
    name: Source-capture historical CTHS 506 membership and class notes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.3 beautifulsoup4==4.12.3
      - name: Check syntax
        run: python -m py_compile scripts/france_academy_cths_society_roster_v1.py
      - name: Collect historic CTHS society list with bounded profile evidence
        run: python scripts/france_academy_cths_society_roster_v1.py --min-count 1000 --max-profiles-per-class 4 --delay 0.7
      - name: Upload source snapshots, conservative candidate labels, audit and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: france-academy-cths-society-roster-pilot-v1
          path: data/france_academy_cths_society_roster_v1/
          if-no-files-found: warn
          retention-days: 90
      - name: Commit reproducible CTHS society history evidence on working branch
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/france_academy_cths_society_roster_v1/
          if ! git diff --cached --quiet; then
            git commit -m "Checkpoint historical French Academy CTHS society source and unverified role candidates v1"
            git push origin HEAD:france-academy-cths-roster-v1
          else
            echo "Nothing new to checkpoint"
          fi
