name: Chess peak Elo v1 - descriptive Shangguan association

on:
  push:
    branches: [codex/chess-single-a-plan-v1]
    paths:
      - 'studies/chess_peak_v1/data/**'
      - 'studies/chess_peak_v1/bundle_data.py'
      - 'studies/chess_peak_v1/shangguan_association.py'
      - '.github/workflows/chess_peak_association_v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: chess-peak-association-${{ github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'
  MPLBACKEND: Agg

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore transported data before checking readiness
        shell: bash
        run: |
          if test -f studies/chess_peak_v1/data/bundle_manifest.json; then
            python3 studies/chess_peak_v1/bundle_data.py restore --repo-root .
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.17'
      - name: Require a complete peak-label manifest
        id: check
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = Path('studies/chess_peak_v1/data/data_manifest.json')
          ready = manifest.is_file() and json.loads(manifest.read_text(encoding='utf-8')).get('status') == 'peak_inputs_complete_before_fitting'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('ready=' + str(ready).lower() + '\n')
          if not ready:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
                  stream.write('Peak labels are not complete; the association analysis is skipped.\n')
          print(json.dumps({'peak_inputs_ready': ready}))
          PY

  verify_and_describe:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.17'
          cache: pip
          cache-dependency-path: studies/chess_single_A_v2/requirements-model.txt
      - run: python -m pip install -r studies/chess_single_A_v2/requirements-model.txt
      - name: Restore and verify the uploaded data bundle offline
        run: python studies/chess_peak_v1/bundle_data.py restore --repo-root .
      - name: Run the study's synthetic implementation checks
        run: python -m unittest discover -s studies/chess_peak_v1 -p 'test_*.py' -v
      - name: Validate both complete disjoint cohorts and paused prediction fitting
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          root = Path.cwd()
          study = root / 'studies/chess_peak_v1'
          config = json.loads((study / 'config.json').read_text(encoding='utf-8'))
          if config.get('fit_allowed') is not False:
              raise ValueError('Prediction-model fitting must remain disabled for this descriptive analysis')
          sys.path.insert(0, str(study))
          from peak_data import load_frame
          frames = {role: load_frame(root, role) for role in ('development', 'primary_new')}
          expected = {'development': 1000, 'primary_new': 500}
          identities = {}
          for role, frame in frames.items():
              identities[role] = set(frame.canonical_id.astype(str))
              if len(frame) != expected[role] or len(identities[role]) != expected[role]:
                  raise ValueError('Incomplete or duplicated cohort: ' + role)
          overlap = identities['development'] & identities['primary_new']
          if overlap:
              raise ValueError('Person overlap between development and NEW cohorts')
          print(json.dumps({'validated_people': {role: len(frame) for role, frame in frames.items()}, 'person_overlap': 0, 'fit_allowed': False}))
          PY
      - name: Describe Shangguan and observed peak Elo
        run: python studies/chess_peak_v1/shangguan_association.py --repo-root . --output-dir studies/chess_peak_v1/shangguan_results
      - name: Preserve descriptive results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chess-peak-association-v1-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: studies/chess_peak_v1/shangguan_results/
          if-no-files-found: warn
          retention-days: 90
      - name: Commit the descriptive report and tables
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- studies/chess_peak_v1/shangguan_results/
          if ! git diff --cached --quiet; then
            git commit -m 'Describe Shangguan associations with audited peak Elo labels [skip ci]'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - run: cat studies/chess_peak_v1/shangguan_results/REPORT.md >> "$GITHUB_STEP_SUMMARY"
