name: France Academy historical election heading variants
on:
  push:
    branches:
      - france-academy-211-volume-coverage-audit-v1-20261018
    paths:
      - 'scripts/france_academy_wikisource_legacy_election_headings_v1.py'
      - '.github/workflows/france_academy_legacy_election_headings_v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  old-heading-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned HTML source parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3
      - name: Offline synthetic regression for 1835 and 1880 headings
        run: python -m py_compile scripts/france_academy_wikisource_legacy_election_headings_v1.py && python scripts/france_academy_wikisource_legacy_election_headings_v1.py --fixture-check
      - name: Temporary inspect early 1835 election HTML markup
        run: |
          python - <<'PY'
          import re
          from bs4 import BeautifulSoup
          from france_academy_wikisource_index_preflight_v1 import build_urls,read_one
          _,_,b=read_one(build_urls(1,1835)['wiki'],900000)
          soup=BeautifulSoup(b,'html.parser')
          matches=soup.find_all(string=re.compile('Élections|Élie de Beaumont|est élu membre',re.I))
          print('EARLY_DOM_COUNT',len(matches))
          for node in matches[:15]:
              anc=node.parent
              chain=[]
              for _ in range(5):
                  if anc is None:break
                  chain.append({'tag':anc.name,'class':anc.get('class'),'id':anc.get('id'),'text':anc.get_text(' ',strip=True)[:175]})
                  anc=anc.parent
              print('EARLY_DOM',str(node)[:190],chain)
          PY
      - name: Bounded public source query 1835 1862 1880 1926
        run: python scripts/france_academy_wikisource_legacy_election_headings_v1.py --limit 4
      - name: Upload role and event provenance (not source text)
        uses: actions/upload-artifact@v4
        with:
          name: france-academy-1835-1880-legacy-elections-pilot-v1
          path: data/france_academy_wikisource_legacy_heading_pilot_v1/
          retention-days: 40
      - name: Commit source metadata for limited verified historical headings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/france_academy_wikisource_legacy_heading_pilot_v1/
          if ! git diff --cached --quiet; then
            git commit -m 'Checkpoint historical 1835 Nominations/Elections transcription-source event leads'
            git push origin HEAD:france-academy-211-volume-coverage-audit-v1-20261018
          fi
