name: France Academy cross-volume election decree index provenance v2
on:
  push:
    branches:
      - france-academy-election-approval-chain-v1-20261018
    paths:
      - 'scripts/france_academy_cross_volume_vote_decree_link_v2.py'
      - '.github/workflows/france_academy_cross_volume_link_v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  two-pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned HTML parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3
      - name: Test 1926 and 1934 cross-volume parsing and nonacceptance
        run: python -m py_compile scripts/france_academy_cross_volume_vote_decree_link_v2.py && python scripts/france_academy_cross_volume_vote_decree_link_v2.py --fixture-check
      - name: Parse both semester volumes for 1926 and 1934
        run: python scripts/france_academy_cross_volume_vote_decree_link_v2.py --pairs 2
      - name: QA actual cross-volume linkage and no implied effective membership
        run: |
          python - <<'PY'
          import json
          p='data/france_academy_cross_volume_vote_decree_pilot_v2/summary.json'
          x=json.load(open(p,encoding='utf8'))
          assert x['parsed_election_event_rows']>=12
          assert x['cross_volume_links']>=2
          assert x['original_government_decree_documents_opened']==0
          assert x['legal_approval_date_adjudicated']==0
          assert x['full_study_members_accepted']==0 and x['study_birthdays_accepted']==0 and x['bazi_variables_computed']==0
          print('Cross volume source-only QA passed')
          PY
      - name: Preserve audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: france-1926-1934-next-volume-approval-index-source-pilot-v2
          path: data/france_academy_cross_volume_vote_decree_pilot_v2/
          retention-days: 45
      - name: Commit compact source-index candidate metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/france_academy_cross_volume_vote_decree_pilot_v2/
          if ! git diff --cached --quiet; then
            git commit -m 'Checkpoint 1926 and 1934 election-to-next-volume-decree index provenance'
            git fetch origin france-academy-election-approval-chain-v1-20261018
            git rebase origin/france-academy-election-approval-chain-v1-20261018
            git push origin HEAD:france-academy-election-approval-chain-v1-20261018
          fi
