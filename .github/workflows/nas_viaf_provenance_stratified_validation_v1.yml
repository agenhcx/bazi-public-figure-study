name: NAS VIAF Provenance-Stratified Validation v1
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/nas_viaf_provenance_stratified_validation_v1.py'
      - '.github/workflows/nas_viaf_provenance_stratified_validation_v1.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download frozen v16
        uses: actions/download-artifact@v4
        with:
          name: nas-dob-v16-zanni-provenance
          github-token: ${{ github.token }}
          repository: agenhcx/bazi-public-figure-study
          run-id: 37860554354
          path: data/v16
      - name: Download successful VIAF diagnostic
        uses: actions/download-artifact@v4
        with:
          name: nas-viaf-dob-diagnostic-v1
          github-token: ${{ github.token }}
          repository: agenhcx/bazi-public-figure-study
          run-id: 38052372047
          path: data/viaf
      - name: Run stratified validation
        run: python scripts/nas_viaf_provenance_stratified_validation_v1.py
      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: nas-viaf-provenance-stratified-validation-v1
          path: |
            data/nas_viaf_validation_by_v16_status_v1.csv
            data/nas_viaf_validation_conflicts_by_status_v1.csv
            data/summary_nas_viaf_validation_by_v16_status_v1.json
          if-no-files-found: error
