name: Royal Society Past DOB Internal Audit v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/royal_society_past_dob_internal_audit_v1.py'
      - '.github/workflows/royal_society_past_dob_internal_audit_v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: royal-society-past-dob-consolidated-v1
          github-token: ${{ github.token }}
          repository: agenhcx/bazi-public-figure-study
          run-id: 37929852241
          path: data/royal_society_past_dob_audit_inputs_v1
      - name: Audit conflicts and retry prior network failures
        run: python scripts/royal_society_past_dob_internal_audit_v1.py --shard-index ${{ matrix.shard }} --shard-count 3
      - uses: actions/upload-artifact@v4
        with:
          name: royal-society-past-dob-internal-audit-v1-shard-${{ matrix.shard }}
          path: data/royal_society_past_dob_internal_audit_v1/shard_0${{ matrix.shard }}_of_03/
          if-no-files-found: error
