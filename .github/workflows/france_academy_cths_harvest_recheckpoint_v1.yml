name: France CTHS DOB source archive recheckpoint from completed shard run v1

on:
  push:
    branches:
      - france-academy-cths-roster-v1
    paths:
      - .github/workflows/france_academy_cths_harvest_recheckpoint_v1.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  recover-and-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source audit parsing and request dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.3 beautifulsoup4==4.12.3 ftfy==6.3.1
      - name: Wait for four already requested CTHS source shard artifacts
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import time
          import requests
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/39086523604/artifacts"
          expected={f"cths-birth-source-shard-{i}" for i in range(4)}
          for trial in range(1,49):
              response=requests.get(url,headers={"Authorization":"Bearer "+os.environ["REPO_TOKEN"],"Accept":"application/vnd.github+json"},timeout=25)
              response.raise_for_status()
              present={a["name"] for a in response.json()["artifacts"] if not a.get("expired",False)}
              print(f"source artifact check {trial}: {sorted(present&expected)}",flush=True)
              if expected<=present:
                  break
              time.sleep(15)
          else:
              raise SystemExit("Four shard source artifacts unavailable; inspect original source-harvest run")
          PY
      - name: Download source shards from original source-harvest run
        uses: actions/download-artifact@v4
        with:
          run-id: 39086523604
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: cths-birth-source-shard-*
          path: worktree/cths-shard-artifacts
          merge-multiple: false
      - name: Consolidate identity-complete evidence and SHA-audited compressed HTML
        run: python scripts/france_academy_cths_dob_source_harvest_v1.py --consolidate-from worktree/cths-shard-artifacts
      - name: Upload reconciled evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: france-academy-cths-562-dob-source-reconciled-v1
          path: |
            data/france_academy_cths_profile_dob_harvest_v1/cths_dob_claims_all_targets_candidate_only_v1.csv
            data/france_academy_cths_profile_dob_harvest_v1/birthdate_parse_coverage_by_birth_decade_v1.csv
            data/france_academy_cths_profile_dob_harvest_v1/cths_profile_source_html_sha256_bundle_v1.tar.gz
            data/france_academy_cths_profile_dob_harvest_v1/summary.json
          if-no-files-found: warn
          retention-days: 90
      - name: Checkpoint audited DOB candidates on latest researcher branch
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/france_academy_cths_profile_dob_harvest_v1/cths_dob_claims_all_targets_candidate_only_v1.csv data/france_academy_cths_profile_dob_harvest_v1/birthdate_parse_coverage_by_birth_decade_v1.csv data/france_academy_cths_profile_dob_harvest_v1/cths_profile_source_html_sha256_bundle_v1.tar.gz data/france_academy_cths_profile_dob_harvest_v1/summary.json
          if ! git diff --cached --quiet; then
            git commit -m "Checkpoint independent-source-pending raw CTHS DOB claims for 562 French Academy leads"
            git pull --rebase origin france-academy-cths-roster-v1
            git push origin HEAD:france-academy-cths-roster-v1
          fi
