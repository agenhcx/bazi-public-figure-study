name: France Academy 1994 Gallica index documented API pilot v1

on:
  push:
    branches:
      - france-cths-562-original-citation-audit-v1
    paths:
      - scripts/france_academy_gallica_1994_index_probe_v1.py
      - .github/workflows/france_academy_gallica_1994_index_probe_v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gallica-bounded-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests only
        run: python -m pip install --disable-pip-version-check requests==2.32.3
      - name: Verify source identity and allowed Gallica endpoints offline
        run: python -m py_compile scripts/france_academy_gallica_1994_index_probe_v1.py && python scripts/france_academy_gallica_1994_index_probe_v1.py --fixture-check
      - name: Make at most 3 non-redirecting Gallica API requests
        run: python scripts/france_academy_gallica_1994_index_probe_v1.py --probe --limit 3 --timeout 18 --delay 1.5
      - name: Confirm no membership/DOB acceptance regardless of source access
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("local_runs/france_academy_gallica_1994_index_probe_v1/summary.json").read_text(encoding="utf-8"))
          assert d["number_of_source_requests"]<=3
          assert d["accepted_exact_dob"]==0 and d["accepted_full_member"]==0
          assert d["bazi_variables_computed"]==0
          print("Gallica API access results were recorded without source bypass or analysis.")
          PY
      - name: Upload only compact source API status, never book or OCR text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: france-academy-gallica-1994-index-api-access-pilot-v1
          path: local_runs/france_academy_gallica_1994_index_probe_v1/summary.json
          if-no-files-found: warn
          retention-days: 30
      - name: Checkpoint only Gallica API access report
        if: success()
        run: |
          dest=data/france_academy_cths_historical_source_citation_audit_v1/gallica_1994_index_access_v1
          mkdir -p "$dest"
          cp local_runs/france_academy_gallica_1994_index_probe_v1/summary.json "$dest/summary.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          if ! git diff --cached --quiet; then
            git commit -m "Checkpoint only three documented Gallica 1994 index API access results"
            git pull --rebase origin france-cths-562-original-citation-audit-v1
            git push origin HEAD:france-cths-562-original-citation-audit-v1
          fi
