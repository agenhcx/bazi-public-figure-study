name: France matchID public pilot synthetic QA
on:
  pull_request:
    paths:
      - 'scripts/france_academy_matchid_public_pilot_v1.py'
      - 'FRANCE_ACADEMY_MATCHID_PUBLIC_SOURCE_PILOT_V1.md'
      - '.github/workflows/france_matchid_public_pilot_smoke_v1.yml'
  workflow_dispatch:
jobs:
  synthetic-offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check source syntax
        run: python -m py_compile scripts/france_academy_matchid_public_pilot_v1.py
      - name: Synthetic unit checks without network
        run: python scripts/france_academy_matchid_public_pilot_v1.py --fixture-check
      - name: Real roster dry-run without network
        run: python scripts/france_academy_matchid_public_pilot_v1.py --dry-run --limit 10
      - name: Temporary one-person v1_3 full-pipeline public source probe
        if: matrix.python-version == '3.10'
        run: |
          python scripts/france_academy_matchid_public_pilot_v1.py --limit 1 --timeout 15 --out local_runs/france_matchid_v1_3_one_person_probe
          python - <<'PY'
          import csv, collections
          p = 'local_runs/france_matchid_v1_3_one_person_probe/'
          with open(p + 'person_query_status_v1.csv', encoding='utf-8-sig', newline='') as f:
              x = next(csv.DictReader(f))
          with open(p + 'matchid_source_candidates_v1.csv', encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          print('V1_3_LIVE', {'http_status': x.get('query_status'), 'api_total': x.get('api_total_claim'),
                'parsed_hits': x.get('parsed_hit_count'), 'source_rows': len(rows),
                'strict_name_year': sum(y['name_birthyear_comparison'] == 'STRICT_NAME_AND_YEAR_CANDIDATE' for y in rows),
                'strict_and_deathyear': sum(y['name_birthyear_comparison'] == 'STRICT_NAME_AND_YEAR_CANDIDATE' and y['deathyear_comparison'] == 'DEATHYEAR_AGREES_CTHS' for y in rows),
                'error': x.get('error_preview', '')[:250]})
          PY
