name: France matchID public pilot synthetic QA
on:
  pull_request:
    paths:
      - 'scripts/france_academy_matchid_public_pilot_v1.py'
      - 'FRANCE_ACADEMY_MATCHID_PUBLIC_SOURCE_PILOT_V1.md'
      - '.github/workflows/france_matchid_public_pilot_smoke_v1.yml'
  workflow_dispatch:
jobs:
  synthetic-offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check source syntax
        run: python -m py_compile scripts/france_academy_matchid_public_pilot_v1.py
      - name: Synthetic unit checks without network
        run: python scripts/france_academy_matchid_public_pilot_v1.py --fixture-check
      - name: Real roster dry-run without network
        run: python scripts/france_academy_matchid_public_pilot_v1.py --dry-run --limit 10
      - name: Temporary one-query public API format probe
        if: matrix.python-version == '3.10'
        run: |
          python scripts/france_academy_matchid_public_pilot_v1.py --limit 1 --timeout 12 --out local_runs/france_matchid_one_query_probe
          python -c "import csv; r=next(csv.DictReader(open('local_runs/france_matchid_one_query_probe/person_query_status_v1.csv',encoding='utf-8-sig'))); print('API_RESULT', {k:r.get(k,'') for k in ('query_status','finding','parsed_hit_count','error_preview')})"
