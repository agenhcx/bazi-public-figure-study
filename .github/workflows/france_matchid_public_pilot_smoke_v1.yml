name: France matchID public pilot synthetic QA
on:
  pull_request:
    paths:
      - 'scripts/france_academy_matchid_public_pilot_v1.py'
      - 'FRANCE_ACADEMY_MATCHID_PUBLIC_SOURCE_PILOT_V1.md'
      - '.github/workflows/france_matchid_public_pilot_smoke_v1.yml'
  workflow_dispatch:
jobs:
  synthetic-offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check source syntax
        run: python -m py_compile scripts/france_academy_matchid_public_pilot_v1.py
      - name: Synthetic unit checks without network
        run: python scripts/france_academy_matchid_public_pilot_v1.py --fixture-check
      - name: Real roster dry-run without network
        run: python scripts/france_academy_matchid_public_pilot_v1.py --dry-run --limit 10
      - name: Temporary compact birthDate range validation probe
        if: matrix.python-version == '3.10'
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, urllib.parse
          params = {"q": "jean dieudonne", "birthDate": "01/01/1906-31/12/1906", "size": "20"}
          req = urllib.request.Request("https://deces.matchid.io/deces/api/v1/search?" + urllib.parse.urlencode(params), headers={"Accept": "application/json", "User-Agent": "bazi-public-figure-study/1.0 (bounded source validation)"})
          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  doc = json.loads(response.read(200000))
              info = doc.get("response", {})
              print("COMPACT_FILTER_PROBE", {"http": 200, "reported_total": info.get("total"), "persons_this_page": len(info.get("persons", [])), "msg": str(doc.get("msg", ""))[:120]})
          except urllib.error.HTTPError as e:
              print("COMPACT_FILTER_PROBE", {"http": e.code, "error_body": e.read(600).decode("utf-8", "replace")[:350]})
          except urllib.error.URLError as e:
              print("COMPACT_FILTER_PROBE", {"network_error": str(e.reason)[:200]})
          PY
