name: France matchID public pilot synthetic QA
on:
  pull_request:
    paths:
      - 'scripts/france_academy_matchid_public_pilot_v1.py'
      - 'FRANCE_ACADEMY_MATCHID_PUBLIC_SOURCE_PILOT_V1.md'
      - '.github/workflows/france_matchid_public_pilot_smoke_v1.yml'
  workflow_dispatch:
jobs:
  synthetic-offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check source syntax
        run: python -m py_compile scripts/france_academy_matchid_public_pilot_v1.py
      - name: Synthetic unit checks without network
        run: python scripts/france_academy_matchid_public_pilot_v1.py --fixture-check
      - name: Real roster dry-run without network
        run: python scripts/france_academy_matchid_public_pilot_v1.py --dry-run --limit 10
      - name: Temporary 10-person bounded live source-provenance pilot
        if: matrix.python-version == '3.10'
        run: |
          python scripts/france_academy_matchid_public_pilot_v1.py --limit 10 --timeout 12 --out local_runs/france_matchid_v1_3_ten_source_probe
          python - <<'PY'
          import csv, collections, json
          p = 'local_runs/france_matchid_v1_3_ten_source_probe/'
          with open(p + 'person_query_status_v1.csv', encoding='utf-8-sig', newline='') as f:
              statuses = list(csv.DictReader(f))
          with open(p + 'matchid_source_candidates_v1.csv', encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          strict = [r for r in rows if r['name_birthyear_comparison'] == 'STRICT_NAME_AND_YEAR_CANDIDATE']
          death = [r for r in strict if r['deathyear_comparison'] == 'DEATHYEAR_AGREES_CTHS']
          print('TEN_PILOT_SUMMARY', json.dumps({
              'persons_queried': len(statuses), 'statuses': dict(collections.Counter(r['query_status'] for r in statuses)),
              'all_api_candidate_rows': len(rows), 'strict_name_birthyear_rows': len(strict),
              'strict_name_birthyear_deathyear_rows': len(death),
              'strict_date_agreements': sum(r['dob_comparison'] == 'API_DOB_AGREES_CTHS' for r in death),
              'strict_date_conflicts': sum(r['dob_comparison'] == 'API_DOB_CONFLICTS_CTHS' for r in death),
              'strict_cths_date_missing': sum(r['dob_comparison'] == 'CTHS_DOB_MISSING_NEW_LEAD' for r in death)
          }, ensure_ascii=False))
          print('TEN_PILOT_PEOPLE', json.dumps([{
             'id': s['cths_person_id'], 'name': s['name'], 'status': s['query_status'],
             'api_candidates': s['parsed_hit_count'], 'api_total': s['api_total_claim'],
             'strict_deathyear_candidates': sum(r['cths_person_id'] == s['cths_person_id'] for r in death),
             'error': s.get('error_preview', '')[:160]
          } for s in statuses], ensure_ascii=False))
          print('TEN_PILOT_STRICT_DOB_CLAIMS', json.dumps([{
              'id': r['cths_person_id'], 'api_dob': r['api_birthdate_claim'],
              'cths_dob': r['cths_exact_dob_candidate'], 'dob_status': r['dob_comparison'],
              'api_death': r['api_deathdate_claim']
          } for r in death], ensure_ascii=False))
          PY
