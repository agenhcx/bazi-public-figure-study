name: France Academy 1839 Liouville royal approval and 1927 Fabry original scans
on:
  push:
    branches:
      - france-academy-shard02-and-original-events-v1-20261018
    paths:
      - 'scripts/france_academy_1839_1927_original_scan_audit_v1.py'
      - '.github/workflows/france_academy_originals_1839_1927_v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bounded-source-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned Wikisource HTML reader
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3
      - name: Compile and verify fixed source page targets with zero network
        run: python -m py_compile scripts/france_academy_1839_1927_original_scan_audit_v1.py && python scripts/france_academy_1839_1927_original_scan_audit_v1.py --fixture-check
      - name: Fetch up to three Commons source pages with distinct original scan hashes
        run: python scripts/france_academy_1839_1927_original_scan_audit_v1.py --download --delay 1.5
      - name: Verify original page mapping and source-only study boundary
        run: |
          python - <<'PY'
          import json
          p='data/france_academy_1839_1927_three_original_pages_v1/three_archival_original_scan_source_leads_v1.json'
          s=json.load(open(p,encoding='utf8'))
          assert len(s['source_records'])==3
          assert s['frozen_full_member_study_additions']==0 and s['frozen_DOB_additions']==0 and s['bazi_variables_computed']==0
          assert s['original_scanned_pages_visually_interpreted_by_script']==0
          print('ORIGINAL_SCAN_QA',[(r['volume'],r['original_printed_page_candidate'],r['status'],r.get('djvu_frame'),r.get('source_preview_bytes')) for r in s['source_records']])
          PY
      - name: Preserve three small public-domain journal page JPEGs for visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: france-academy-liouville-1839-fabry-1927-original-three-images-v1
          path: local_runs/france_academy_1839_1927_original_preview_v1/*.jpg
          if-no-files-found: warn
          retention-days: 14
      - name: Archive source statuses even if individual source preview unavailable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: france-academy-1839-1927-original-page-metadata-v1
          path: data/france_academy_1839_1927_three_original_pages_v1/
          retention-days: 30
      - name: Commit only metadata and public source links, not original page images
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/france_academy_1839_1927_three_original_pages_v1/
          if ! git diff --cached --quiet; then
            git commit -m 'Record source location, page-map and SHA metadata for 1839 and 1927 original Academy scans'
            git fetch origin france-academy-shard02-and-original-events-v1-20261018
            git rebase origin/france-academy-shard02-and-original-events-v1-20261018
            git push origin HEAD:france-academy-shard02-and-original-events-v1-20261018
          fi
