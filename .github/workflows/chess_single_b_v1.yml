name: Chess single B1 - constrained five-phase representation

on:
  push:
    branches: [codex/chess-single-a-plan-v1]
    paths:
      - 'studies/chess_single_B_v1/**'
      - '.github/workflows/chess_single_b_v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: chess-single-b-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'
  MPLBACKEND: Agg

jobs:
  verify_lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.17'
          cache: pip
          cache-dependency-path: studies/chess_single_A_v2/requirements-model.txt
      - run: python -m pip install -r studies/chess_single_A_v2/requirements-model.txt
      - name: Synthetic B1 implementation checks
        run: python -m unittest discover -s studies/chess_single_B_v1 -p 'test_*.py' -v
      - name: Verify unchanged A1 and fixed B1 sources and environment
        run: python studies/chess_single_B_v1/lock_b1.py verify --repo-root .
      - name: Create immutable B1 tag before research fitting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          b1_tag=chess-single-b-structure-lock-v1
          if git ls-remote --exit-code --tags origin "refs/tags/$b1_tag" >/dev/null; then
            git fetch origin "refs/tags/$b1_tag:refs/tags/$b1_tag"
            b1_commit=$(git rev-parse "$b1_tag^{commit}")
            test "$b1_commit" = "$GITHUB_SHA"
          else
            git tag -a "$b1_tag" "$GITHUB_SHA" -m 'Fix exploratory constrained B1 representation after A results; not a new blind test'
            git push origin "$b1_tag"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b1-source-lock
          path: |
            studies/chess_single_B_v1/PLAN.md
            studies/chess_single_B_v1/b1_lock.json
          if-no-files-found: error
          retention-days: 90

  fit:
    needs: verify_lock
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        task: [outer-0, outer-1, outer-2, outer-3, outer-4, final]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.17'
          cache: pip
          cache-dependency-path: studies/chess_single_A_v2/requirements-model.txt
      - run: python -m pip install -r studies/chess_single_A_v2/requirements-model.txt
      - name: Fit and tune using 2013 only
        env:
          B1_TASK: ${{ matrix.task }}
        run: python -u studies/chess_single_B_v1/train.py --repo-root . --task "$B1_TASK" --output-dir "b1_outputs/$B1_TASK"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b1-fit-${{ matrix.task }}
          path: b1_outputs/${{ matrix.task }}/
          if-no-files-found: error
          retention-days: 90
      - name: Preserve failure records separately
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: failed-b1-${{ matrix.task }}-${{ github.run_attempt }}
          path: b1_outputs/${{ matrix.task }}/
          if-no-files-found: warn
          retention-days: 90

  evaluate:
    needs: fit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.17'
          cache: pip
          cache-dependency-path: studies/chess_single_A_v2/requirements-model.txt
      - run: python -m pip install -r studies/chess_single_A_v2/requirements-model.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: b1-fit-*
          path: collected_b1
          merge-multiple: false
      - name: Seal all development tasks and final fitted models
        run: python studies/chess_single_B_v1/train.py --repo-root . --seal --inputs-dir collected_b1
      - name: Jointly evaluate previously seen NEW500 and report all results
        run: python studies/chess_single_B_v1/evaluate.py --repo-root . --inputs-dir collected_b1 --output-dir studies/chess_single_B_v1/results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chess-single-b1-results-${{ github.run_id }}
          path: studies/chess_single_B_v1/results/
          if-no-files-found: warn
          retention-days: 90
      - name: Commit report and checkpoints
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- studies/chess_single_B_v1/results/
          if ! git diff --cached --quiet; then
            git commit -m 'Report constrained B1 structure comparison and sealed checkpoints [skip ci]'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - run: cat studies/chess_single_B_v1/results/REPORT.md >> "$GITHUB_STEP_SUMMARY"
