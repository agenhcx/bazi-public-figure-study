name: France original Academy 211 volume availability and cross-source audit
on:
  push:
    branches:
      - france-academy-211-volume-coverage-audit-v1-20261018
    paths:
      - 'scripts/france_academy_comptes_rendus_211_volume_inventory_v1.py'
      - '.github/workflows/france_academy_211_volume_inventory_v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-volume-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned HTML parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3
      - name: Compile and run no-network synthetic volume/source tests
        run: python -m py_compile scripts/france_academy_comptes_rendus_211_volume_inventory_v1.py && python scripts/france_academy_comptes_rendus_211_volume_inventory_v1.py --fixture-check
      - name: Run bounded 211 volume catalog and 11 source-table availability probes
        run: python scripts/france_academy_comptes_rendus_211_volume_inventory_v1.py --max-table-probes 11
      - name: Check scientific and provenance invariants
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/france_academy_comptes_rendus_211_volume_inventory_v1/summary.json',encoding='utf8'))
          assert d['category_volume_count']==211 and d['volume_range_1_to_211_complete']
          assert d['no_original_book_election_pages_scanned']
          assert d['no_full_member_roster_completeness_claim']
          assert d['accepted_full_memberships']==0 and d['accepted_exact_dobs']==0 and d['bazi_variables_computed']==0
          print('211 source volumes inventoried without admitting a single study person')
          PY
      - name: Preserve source-only evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: france-academy-211-volume-inventory-pilot-v1
          path: data/france_academy_comptes_rendus_211_volume_inventory_v1/
          retention-days: 45
      - name: Checkpoint compact source URL inventory, no original copyrighted full scans
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/france_academy_comptes_rendus_211_volume_inventory_v1/
          if ! git diff --cached --quiet; then
            git commit -m 'Checkpoint official and Wikisource 211-volume journal inventory plus 11 source-availability probes'
            git push origin HEAD:france-academy-211-volume-coverage-audit-v1-20261018
          fi
