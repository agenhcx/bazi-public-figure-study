name: France Academy CTHS Wikidata strict identity crosswalk v1

on:
  push:
    branches:
      - france-academy-cths-roster-v1
    paths:
      - scripts/france_academy_cths_wikidata_crosswalk_v1.py
      - .github/workflows/france_academy_cths_wikidata_crosswalk_v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-identity-crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m py_compile scripts/france_academy_cths_wikidata_crosswalk_v1.py
      - name: Strict crosswalk, with no auto-acceptance of cohort or DOB
        run: python scripts/france_academy_cths_wikidata_crosswalk_v1.py
      - name: Upload review and strict matches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: france-academy-cths-wikidata-strict-crosswalk-v1
          path: data/france_academy_cths_wikidata_crosswalk_v1/
          if-no-files-found: warn
          retention-days: 90
      - name: Checkpoint crosswalk output
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/france_academy_cths_wikidata_crosswalk_v1/
          if ! git diff --cached --quiet; then
            git commit -m "Checkpoint conservative France CTHS Wikidata identity crosswalk v1"
            git push origin HEAD:france-academy-cths-roster-v1
          fi
