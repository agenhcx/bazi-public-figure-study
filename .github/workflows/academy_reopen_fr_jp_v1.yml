name: France Japan academy collection and completion ledgers

on:
  push:
    branches: ['codex/academy-fr-jp-reopen-20261029']
    paths:
      - 'studies/academy_reopen_fr_jp_v1/**'
      - 'studies/academy_fr_jp_completion_v2/**'
      - 'studies/academy_fr_jp_completion_v3/**'
      - 'JAPAN_ACADEMY_CURRENT_CHECKPOINT.md'
      - 'ACADEMY_COLLECTION_CURRENT_CHECKPOINT.md'
      - '.github/workflows/academy_reopen_fr_jp_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-ledger-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate identity, missingness and calendar rules
        run: python3 -m unittest discover -s studies/academy_reopen_fr_jp_v1/tests -v
      - name: Rebuild Japanese candidate and DOB ledgers offline
        run: python3 studies/academy_reopen_fr_jp_v1/scripts/assemble_japan_dob.py --output-dir "${{ runner.temp }}/academy-japan-replay"
      - name: Compare all saved outputs
        run: diff -r studies/academy_reopen_fr_jp_v1/outputs "${{ runner.temp }}/academy-japan-replay"
      - name: Verify study source metadata hashes
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('studies/academy_reopen_fr_jp_v1')
          m = json.loads((root / 'MANIFEST.json').read_text())
          for rel, expected in m['files'].items():
              if hashlib.sha256((root / rel).read_bytes()).hexdigest() != expected:
                  raise SystemExit(f'Hash mismatch: {rel}')
          f = json.loads((root / 'inputs/france_case_updates.json').read_text())
          santy = next(r for r in f['records'] if r['cths_person_id'] == '110681')
          assert santy['claimed_role'] == 'CORRESPONDENT_AT_DEATH'
          assert santy['case_disposition'] == 'EXCLUDE_FROM_PRIMARY_FULL_MEMBER_CANDIDATE_LAYER'
          assert not santy['dob_conflict_resolved']
          print(f'{len(m["files"])} study file hashes verified; France role/DOB distinction preserved')
          PY
      - name: Save candidate ledgers and case evidence metadata
        uses: actions/upload-artifact@v4
        with:
          name: academy-france-japan-reopened-v1
          path: |
            ${{ runner.temp }}/academy-japan-replay/
            studies/academy_reopen_fr_jp_v1/inputs/france_case_updates.json
            studies/academy_reopen_fr_jp_v1/source_audits/
          if-no-files-found: error
          retention-days: 14
      - name: Validate expanded Japan identity and calendar routing
        run: python3 -m unittest discover -s studies/academy_fr_jp_completion_v2/tests -v
      - name: Rebuild normalized institution claims
        run: |
          python3 studies/academy_fr_jp_completion_v2/scripts/normalize_japan.py --output-dir "${{ runner.temp }}/academy-normalized-v2"
          for name in japan_body_claims.json japan_processed_ids.json japan_dob_holds.json; do
            diff "studies/academy_fr_jp_completion_v2/inputs/$name" "${{ runner.temp }}/academy-normalized-v2/$name"
          done
      - name: Replay expanded Japan master and France decisions
        run: |
          python3 studies/academy_fr_jp_completion_v2/scripts/build_japan.py --output-dir "${{ runner.temp }}/academy-japan-v2"
          diff -r studies/academy_fr_jp_completion_v2/japan_outputs "${{ runner.temp }}/academy-japan-v2"
          python3 -I studies/academy_fr_jp_completion_v2/france/assemble_france.py --output-dir "${{ runner.temp }}/academy-france-v2"
          diff -r studies/academy_fr_jp_completion_v2/france/outputs "${{ runner.temp }}/academy-france-v2"
      - name: Verify completion metadata hashes and totals
        run: python3 studies/academy_fr_jp_completion_v2/scripts/verify_study.py
      - name: Save updated country tables and gaps
        uses: actions/upload-artifact@v4
        with:
          name: academy-france-japan-completion-v2
          path: |
            studies/academy_fr_jp_completion_v2/round_summary.json
            studies/academy_fr_jp_completion_v2/README.md
            studies/academy_fr_jp_completion_v2/japan_outputs/
            studies/academy_fr_jp_completion_v2/france/outputs/
          if-no-files-found: error
          retention-days: 14
      - name: Validate continuation source tiers and membership gates
        run: python3 -m unittest discover -s studies/academy_fr_jp_completion_v3/tests -v
      - name: Rebuild pinned continuation inputs
        run: |
          python3 studies/academy_fr_jp_completion_v3/scripts/prepare_inputs.py --output-dir "${{ runner.temp }}/academy-v3-inputs"
          for name in japan_claims.json japan_decisions.json japan_processed_ids.json france_decisions.json; do
            diff "studies/academy_fr_jp_completion_v3/inputs/$name" "${{ runner.temp }}/academy-v3-inputs/$name"
          done
      - name: Replay both continued country masters
        run: |
          python3 studies/academy_fr_jp_completion_v3/scripts/assemble.py --output-dir "${{ runner.temp }}/academy-v3-output"
          diff -r studies/academy_fr_jp_completion_v3/outputs "${{ runner.temp }}/academy-v3-output"
          python3 studies/academy_fr_jp_completion_v3/scripts/verify_study.py
      - name: Save continued country tables and source tiers
        uses: actions/upload-artifact@v4
        with:
          name: academy-france-japan-continuation-v3
          path: |
            studies/academy_fr_jp_completion_v3/README.md
            studies/academy_fr_jp_completion_v3/outputs/
          if-no-files-found: error
          retention-days: 14
