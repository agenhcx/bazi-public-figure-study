name: NAS VIAF Full Provenance Validation v1
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/nas_viaf_full_validation_shard_v1.py'
      - 'scripts/nas_viaf_full_validation_consolidate_v1.py'
      - '.github/workflows/nas_viaf_full_validation_v1.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download frozen v16
        uses: actions/download-artifact@v4
        with:
          name: nas-dob-v16-zanni-provenance
          github-token: ${{ github.token }}
          repository: agenhcx/bazi-public-figure-study
          run-id: 37860554354
          path: data
      - name: Run full validation shard
        run: python scripts/nas_viaf_full_validation_shard_v1.py --shard ${{ matrix.shard }} --shards 8
      - name: Upload shard
        uses: actions/upload-artifact@v4
        with:
          name: nas-viaf-full-validation-shard-${{ matrix.shard }}
          path: |
            data/nas_viaf_full_validation_shard${{ matrix.shard }}.csv
            data/summary_nas_viaf_full_validation_shard${{ matrix.shard }}.json
          if-no-files-found: error
  consolidate:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download all shards
        uses: actions/download-artifact@v4
        with:
          pattern: nas-viaf-full-validation-shard-*
          merge-multiple: true
          path: data
      - name: Consolidate
        run: python scripts/nas_viaf_full_validation_consolidate_v1.py
      - name: Upload consolidated validation
        uses: actions/upload-artifact@v4
        with:
          name: nas-viaf-full-validation-v1
          path: |
            data/nas_viaf_full_validation_by_status_v1.csv
            data/nas_viaf_full_validation_conflicts_v1.csv
            data/summary_nas_viaf_full_validation_v1.json
          if-no-files-found: error
