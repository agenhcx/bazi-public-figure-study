name: Royal Society Missing Election Date Probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/royal_society_missing_election_date_probe_v1.py'
      - '.github/workflows/royal_society_missing_election_date_probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe missing election-date Fellows
        run: python scripts/royal_society_missing_election_date_probe_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: royal-society-missing-election-date-probe
          path: data/royal_society_missing_election_date_probe_v1/
          if-no-files-found: error
