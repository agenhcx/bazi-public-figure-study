name: Leopoldina Detail HTML Probe v1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/leopoldina_detail_probe_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: leopoldina-detail-html-probe-v1
          path: data/leopoldina_detail_probe_v1/
