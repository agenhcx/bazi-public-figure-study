name: NAS DOB LOC Supplement v5

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/nas_manual_dob_supplement_v5.py'
      - 'data/nas_science_core_dob_manual_supplement_v5.csv'
      - '.github/workflows/nas_dob_loc_supplement_v5.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  supplement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download frozen v11 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: nas-dob-v8-checkpoint
          github-token: ${{ github.token }}
          repository: agenhcx/bazi-public-figure-study
          run-id: 37702487599
          path: data

      - name: Apply audited LOC-provenance supplement v5
        run: python scripts/nas_manual_dob_supplement_v5.py

      - name: Upload v12 checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: nas-dob-v12-loc-supplement
          path: |
            data/nas_science_core_dob_crosswalk/nas_science_core_dob_crosswalk_v12.csv
            data/nas_science_core_dob_crosswalk/nas_science_core_dob_manual_supplement_log_v5.csv
            data/nas_science_core_dob_crosswalk/summary_v12.json
            data/nas_science_core_dob_manual_supplement_v5.csv
          if-no-files-found: error
