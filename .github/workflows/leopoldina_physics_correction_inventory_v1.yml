name: Leopoldina Physics Correction Inventory v1
on:
  push:
    branches: [leopoldina-roster-probe-v1]
    paths:
      - ".github/workflows/leopoldina_physics_correction_inventory_v1.yml"
permissions:
  contents: read
jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0,1,2,3]
    runs-on: ubuntu-latest
    env:
      SHARD_INDEX: ${{ matrix.shard_index }}
      SHARD_COUNT: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python scripts/leopoldina_physics_inventory_shard_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: leopoldina-physics-inventory-shard-${{ matrix.shard_index }}
          path: data/leopoldina_physics_inventory_shard_v1/
  consolidate:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/download-artifact@v4
        with:
          pattern: leopoldina-physics-inventory-shard-*
          path: data/leopoldina_physics_inventory_inputs_v1
          merge-multiple: false
      - run: python scripts/leopoldina_physics_inventory_consolidate_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: leopoldina-physics-correction-inventory-v1
          path: data/leopoldina_physics_inventory_v1/
