name: France Academy remaining 172 source shards offline regression
on:
  push:
    branches:
      - france-academy-unprobed-16-volume-batch-v1-20261018
    paths:
      - 'scripts/france_academy_run_remaining_172_toc_batch_v1.py'
      - '.github/workflows/france_academy_remaining_172_shard_smoke_v1.yml'
  workflow_dispatch:
jobs:
  offline-shard-validation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install source-only HTML parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3
      - name: Compile and verify all immutable 172 source targets offline
        run: python -m py_compile scripts/france_academy_run_remaining_172_toc_batch_v1.py && python scripts/france_academy_run_remaining_172_toc_batch_v1.py --fixture-check
      - name: Dry-run next unprobed 16-volume source shard offline
        run: python scripts/france_academy_run_remaining_172_toc_batch_v1.py --shard 0
