name: Leopoldina Roster URL Inventory v1

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/leopoldina_roster_url_inventory_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: leopoldina-roster-url-inventory-v1
          path: data/leopoldina_roster_url_inventory_v1/
