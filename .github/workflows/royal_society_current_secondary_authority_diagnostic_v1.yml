name: Royal Society Current Secondary Authority Diagnostic v1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: royal-society-current-p569-provenance-audit-v1
          github-token: ${{ github.token }}
          repository: agenhcx/bazi-public-figure-study
          run-id: 38007153174
          path: data/royal_society_current_p569_provenance_input
      - name: Diagnose MacTutor SNAC and EOAS exact-DOB availability
        run: python scripts/royal_society_current_secondary_authority_diagnostic_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: royal-society-current-secondary-authority-diagnostic-v1
          path: data/royal_society_current_secondary_authority_diagnostic_v1/
          if-no-files-found: error
