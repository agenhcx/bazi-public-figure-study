name: France Academy vote and decree index linkage pilot
on:
  push:
    branches:
      - france-academy-election-approval-chain-v1-20261018
    paths:
      - 'scripts/france_academy_vote_decree_index_link_v1.py'
      - '.github/workflows/france_academy_vote_decree_index_link_v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vote-versus-decree-source-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned HTML parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3
      - name: Compile and synthetic test without networking
        run: python -m py_compile scripts/france_academy_vote_decree_index_link_v1.py && python scripts/france_academy_vote_decree_index_link_v1.py --fixture-check
      - name: Query 1926 1934 1924 public indexes and audit vote and decree link candidates
        run: python scripts/france_academy_vote_decree_index_link_v1.py --limit 3
      - name: Source only QA of status indicators
        run: |
          python - <<'PY'
          import json
          s=json.load(open('data/france_academy_vote_decree_index_link_pilot_v1/summary.json',encoding='utf8'))
          assert s['elections_parsed']>0
          assert s['final_full_members_accepted']==0
          assert s['final_exact_birthdates_accepted']==0
          assert s['government_approval_legally_adjudicated']==0
          assert s['original_decree_approval_pages_opened']==0
          assert s['bazi_variables_computed']==0
          print('PASS: vote/decree stages remain explicitly separate from accepted membership')
          PY
      - name: Upload source-only audit
        uses: actions/upload-artifact@v4
        with:
          name: france-academy-1926-vote-decree-index-source-pilot-v1
          path: data/france_academy_vote_decree_index_link_pilot_v1/
          retention-days: 40
      - name: Git commit compact source-index metadata only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/france_academy_vote_decree_index_link_pilot_v1/
          if ! git diff --cached --quiet; then
            git commit -m 'Checkpoint publicly transcribed Academy election/decree approval index event chains'
            git fetch origin france-academy-election-approval-chain-v1-20261018
            git rebase origin/france-academy-election-approval-chain-v1-20261018
            git push origin HEAD:france-academy-election-approval-chain-v1-20261018
          fi
