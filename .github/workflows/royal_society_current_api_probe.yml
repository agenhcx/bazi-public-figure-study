name: Royal Society Current API Probe

on:
  push:
    branches: [main]
    paths:
      - 'scripts/royal_society_current_api_probe_v1.py'
      - '.github/workflows/royal_society_current_api_probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe current Fellows Directory POST encoding
        run: python scripts/royal_society_current_api_probe_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: royal-society-current-api-probe
          path: data/royal_society_current_api_probe_v1/
          if-no-files-found: error
