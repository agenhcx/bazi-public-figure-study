name: Royal Society Past DOB Official v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/royal_society_past_dob_official_v1.py'
      - '.github/workflows/royal_society_past_dob_official_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        chunk: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Acquire official past-Fellow exact DOBs
        run: python scripts/royal_society_past_dob_official_v1.py --chunk-index ${{ matrix.chunk }} --chunk-count 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: royal-society-past-dob-official-v1-chunk-${{ matrix.chunk }}
          path: data/royal_society_past_dob_official_v1/chunk_0${{ matrix.chunk }}_of_08/
          if-no-files-found: error
