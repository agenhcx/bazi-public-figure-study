name: Chess single A v2 - prepare and verify model inputs

on:
  push:
    branches: [codex/chess-single-a-plan-v1]
    paths:
      - '.github/workflows/chess_single_a_model_preflight_v2.yml'
      - 'studies/chess_single_A_v2/model_inputs.py'
      - 'studies/chess_single_A_v2/models.py'
      - 'studies/chess_single_A_v2/train_models.py'
      - 'studies/chess_single_A_v2/evaluate_models.py'
      - 'studies/chess_single_A_v2/plot_model_results.py'
      - 'studies/chess_single_A_v2/lock_utils.py'
      - 'studies/chess_single_A_v2/test_*.py'
      - 'studies/chess_single_A_v2/requirements-model.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chess-single-a-v2-preflight-${{ github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'
  MPLBACKEND: Agg

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.17'
          cache: pip
          cache-dependency-path: studies/chess_single_A_v2/requirements-model.txt
      - name: Install exact model dependencies
        run: python -m pip install -r studies/chess_single_A_v2/requirements-model.txt
      - name: Run synthetic tests and acquisition invariants
        run: python -m unittest discover -s studies/chess_single_A_v2 -p 'test_*.py' -v
      - name: Verify completed source cohorts
        run: python studies/chess_single_A_v2/audit_completed_cohorts.py --repo-root .
      - name: Prepare raw-symbol and date inputs without fitting
        run: python studies/chess_single_A_v2/model_inputs.py --repo-root .
      - name: Record verified numerical environment
        run: |
          python studies/chess_single_A_v2/lock_utils.py environment --repo-root . > studies/chess_single_A_v2/data/model_environment.json
          python -m pip freeze > studies/chess_single_A_v2/data/model_pip_freeze.txt
      - name: Save prepared inputs and audits
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chess-single-a-v2-model-inputs-${{ github.run_id }}
          path: studies/chess_single_A_v2/data/
          if-no-files-found: error
          retention-days: 90
      - name: Commit input-preparation checkpoint
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- studies/chess_single_A_v2/data/
          if ! git diff --cached --quiet; then
            git commit -m 'Checkpoint raw-six-symbol model inputs and preflight [skip ci]'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Record scope
        if: always()
        run: echo 'Input preparation and synthetic testing only; no research-data fitting or external predictive scoring.' >> "$GITHUB_STEP_SUMMARY"
