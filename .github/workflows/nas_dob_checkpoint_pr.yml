name: NAS DOB v8 checkpoint PR

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/nas_dob_checkpoint_v8.py'
      - 'scripts/nas_current_profile_dob_supplement_v1.py'
      - 'scripts/nas_manual_dob_supplement_v2.py'
      - 'data/nas_science_core_dob_manual_supplement_v2.csv'
      - '.github/workflows/nas_dob_checkpoint_v8.yml'

permissions:
  contents: read

jobs:
  checkpoint:
    if: github.head_ref == 'nas-dob-continuation-v8'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Wikidata NAS DOB pilot
        run: python scripts/nas_wikidata_dob_pilot.py

      - name: Build NAS science-core DOB crosswalk
        run: python scripts/nas_science_core_dob_crosswalk.py

      - name: Supplement from DBpedia
        run: python scripts/nas_dbpedia_dob_supplement.py

      - name: Diagnose Wikipedia birth dates
        continue-on-error: true
        run: python scripts/nas_wikipedia_bday_diagnostic.py

      - name: Apply audited manual conflict review
        run: python scripts/nas_manual_dob_review_v1.py

      - name: Apply audited exact-DOB supplement v2
        run: python scripts/nas_manual_dob_supplement_v2.py

      - name: Diagnose DOB availability
        run: python scripts/nas_dob_availability_diagnostic_v1.py

      - name: Refresh exact DOB from current NAS official profiles
        run: python scripts/nas_current_profile_dob_supplement_v1.py

      - name: Build v8 checkpoint
        run: python scripts/nas_dob_checkpoint_v8.py

      - name: Upload checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: nas-dob-v8-checkpoint
          path: |
            data/nas_science_core_dob_crosswalk/summary_v7.json
            data/nas_science_core_dob_crosswalk/summary_v8.json
            data/nas_science_core_dob_crosswalk/summary_v9.json
            data/nas_science_core_dob_crosswalk/nas_science_core_dob_crosswalk_v9.csv
            data/nas_science_core_dob_crosswalk/nas_current_profile_dob_diagnostic_v1.csv
            data/nas_science_core_dob_crosswalk/nas_current_profile_dob_supplement_log_v1.csv
            data/nas_science_core_dob_crosswalk/nas_science_core_dob_manual_supplement_log_v2.csv
            data/nas_science_core_dob_crosswalk/nas_science_core_dob_crosswalk_v8.csv
            data/nas_science_core_dob_manual_supplement_v2.csv
            data/nas_wikipedia_candidate_review_v2.csv
            data/nas_science_core_dob_crosswalk/summary_dob_availability_v1.json
            data/nas_science_core_dob_crosswalk/nas_science_core_dob_availability_by_election_decade_v1.csv
            data/nas_science_core_dob_crosswalk/nas_science_core_dob_availability_by_section_v1.csv
            data/nas_science_core_dob_crosswalk/nas_science_core_dob_unresolved_v8.csv
            data/nas_science_core_dob_crosswalk/nas_wikipedia_supplement_candidates_v8.csv
            data/nas_science_core_dob_crosswalk/nas_wikipedia_validation_conflicts_v8.csv
            data/nas_science_core_dob_crosswalk/summary_checkpoint_v8.json
            data/nas_science_core_dob_crosswalk/summary_wikipedia_birthdate_diagnostic.json
          if-no-files-found: warn
