name: Leopoldina Official DOB Pilot v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/leopoldina_official_dob_pilot_v1.py'
      - '.github/workflows/leopoldina_official_dob_pilot_v1.yml'
      - 'data/leopoldina_roster_freeze_v1/**'
      - 'data/leopoldina_roster_freeze_v1.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run official-profile DOB pilot
        run: python scripts/leopoldina_official_dob_pilot_v1.py
      - name: Upload pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: leopoldina-official-dob-pilot-v1
          path: data/leopoldina_official_dob_pilot_v1/
          if-no-files-found: error
