name: Leopoldina Pagination Transport Probe v1
on:
  push:
    branches: [leopoldina-roster-probe-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/leopoldina_pagination_transport_probe_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: leopoldina-pagination-transport-probe-v1
          path: data/leopoldina_pagination_transport_probe_v1/probe.json
