name: Rebuild Leopoldina Detail Birth-Phrase Scan v1
on:
  push:
    branches: [leopoldina-dob-official-v1]
    paths:
      - "scripts/leopoldina_detail_birthphrase_rebuild_v1.py"
      - ".github/workflows/leopoldina_detail_birthphrase_rebuild_v1.yml"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: leopoldina-dob-official-v1
      - uses: actions/download-artifact@v4
        with:
          pattern: leopoldina-detail-birthphrase-s*
          path: data/leopoldina_detail_birthphrase_rebuild/original
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: 38098029758
      - uses: actions/download-artifact@v4
        with:
          pattern: leopoldina-detail-birthphrase-rescue-s*
          path: data/leopoldina_detail_birthphrase_rebuild/rescue
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: 38098604967
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/leopoldina_detail_birthphrase_rebuild_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: leopoldina-detail-birthphrase-candidates-rebuilt-v1
          path: data/leopoldina_detail_birthphrase_candidates_rebuilt_v1/
