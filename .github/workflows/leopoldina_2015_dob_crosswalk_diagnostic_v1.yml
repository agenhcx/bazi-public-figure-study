name: Leopoldina 2015 DOB Crosswalk Diagnostic v1
on:
  push:
    branches: [leopoldina-roster-probe-v1]
    paths:
      - ".github/workflows/leopoldina_2015_dob_crosswalk_diagnostic_v1.yml"
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: leopoldina-2015-pdf-dob-probe-v1
          path: data/leopoldina_2015_crosswalk_input_v1
          run-id: 38094917421
          github-token: ${{ github.token }}
      - run: python scripts/leopoldina_2015_dob_crosswalk_diagnostic_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: leopoldina-2015-dob-crosswalk-diagnostic-v1
          path: data/leopoldina_2015_pdf_crosswalk_diagnostic_v1/
