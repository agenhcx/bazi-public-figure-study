name: NAS Wikidata DOB Pilot

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/nas_*.py'
      - 'data/nas_science_core_dob_manual_review_v1.csv'
      - '.github/workflows/nas_wikidata_dob_pilot.yml'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run NAS Wikidata DOB pilot
        run: python scripts/nas_wikidata_dob_pilot.py

      - name: Crosswalk NAS science-core exact DOB
        run: python scripts/nas_science_core_dob_crosswalk.py

      - name: Supplement exact DOB from DBpedia
        run: python scripts/nas_dbpedia_dob_supplement.py

      - name: Diagnose machine-readable Wikipedia birth dates
        continue-on-error: true
        run: python scripts/nas_wikipedia_bday_diagnostic.py

      - name: Apply audited manual DOB conflict review
        run: python scripts/nas_manual_dob_review_v1.py

      - name: Diagnose DOB availability and birth-year support
        run: python scripts/nas_dob_availability_diagnostic_v1.py

      - name: Upload DOB acquisition outputs
        uses: actions/upload-artifact@v4
        with:
          name: nas-dob-acquisition
          path: |
            data/nas_wikidata_dob_pilot/
            data/nas_science_core_dob_crosswalk/
          if-no-files-found: error
