name: NAS Wikidata DOB Pilot

on:
  push:
    branches:
      - main
      - nas-wikidata-dob-pilot
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run NAS Wikidata DOB pilot
        run: python scripts/nas_wikidata_dob_pilot.py

      - name: Crosswalk NAS science-core exact DOB
        run: python scripts/nas_science_core_dob_crosswalk.py

      - name: Supplement exact DOB from DBpedia
        run: python scripts/nas_dbpedia_dob_supplement.py

      - name: Diagnose machine-readable Wikipedia birth dates
        run: python scripts/nas_wikipedia_bday_diagnostic.py

      - name: Upload DOB acquisition outputs
        uses: actions/upload-artifact@v4
        with:
          name: nas-dob-acquisition
          path: |
            data/nas_wikidata_dob_pilot/
            data/nas_science_core_dob_crosswalk/
          if-no-files-found: error
