name: Chess single A v2 - locked model comparison

on:
  push:
    branches: [codex/chess-single-a-plan-v1]
    paths:
      - 'studies/chess_single_A_v2/analysis_lock.json'
      - '.github/workflows/chess_single_a_models_v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: chess-single-a-v2-models-${{ github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'
  MPLBACKEND: Agg

jobs:
  verify_lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.17'
          cache: pip
          cache-dependency-path: studies/chess_single_A_v2/requirements-model.txt
      - run: python -m pip install -r studies/chess_single_A_v2/requirements-model.txt
      - name: Verify all frozen files and the numerical environment
        run: python studies/chess_single_A_v2/lock_utils.py verify --repo-root .
      - name: Create immutable analysis tag before research fitting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          locked_analysis_tag=chess-single-a-analysis-lock-v2
          if git ls-remote --exit-code --tags origin "refs/tags/$locked_analysis_tag" >/dev/null; then
            git fetch origin "refs/tags/$locked_analysis_tag:refs/tags/$locked_analysis_tag"
            locked_tag_commit=$(git rev-parse "$locked_analysis_tag^{commit}")
            test "$locked_tag_commit" = "$GITHUB_SHA"
          else
            git tag -a "$locked_analysis_tag" "$GITHUB_SHA" -m 'Freeze chess A v2 inputs, subsets, model search, implementation and environment before fitting; prior outcome access disclosed'
            git push origin "$locked_analysis_tag"
          fi
      - name: Save analysis lock evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chess-single-a-v2-analysis-lock
          path: |
            studies/chess_single_A_v2/analysis_lock.json
            studies/chess_single_A_v2/config.json
            studies/chess_single_A_v2/analysis_plan.md
            studies/chess_single_A_v2/requirements-model.txt
          if-no-files-found: error
          retention-days: 90

  train:
    needs: verify_lock
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        task:
          - dev_f0_n400
          - dev_f0_n600
          - dev_f0_n800
          - dev_f1_n400
          - dev_f1_n600
          - dev_f1_n800
          - dev_f2_n400
          - dev_f2_n600
          - dev_f2_n800
          - dev_f3_n400
          - dev_f3_n600
          - dev_f3_n800
          - dev_f4_n400
          - dev_f4_n600
          - dev_f4_n800
          - final_random_500
          - final_random_800
          - final_random_1000
          - final_ranked_500_with_ties
          - final_ranked_800_with_ties
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.17'
          cache: pip
          cache-dependency-path: studies/chess_single_A_v2/requirements-model.txt
      - run: python -m pip install -r studies/chess_single_A_v2/requirements-model.txt
      - name: Run the prespecified 2013-only task
        run: python -u studies/chess_single_A_v2/train_models.py --repo-root . --task "${{ matrix.task }}" --output-dir "training_runs/${{ matrix.task }}"
      - name: Save complete fitted-model artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fit-${{ matrix.task }}
          path: training_runs/${{ matrix.task }}/
          if-no-files-found: error
          retention-days: 90
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: failed-fit-${{ matrix.task }}-${{ github.run_attempt }}
          path: training_runs/${{ matrix.task }}/
          if-no-files-found: warn
          retention-days: 90

  seal:
    needs: train
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.17'
          cache: pip
          cache-dependency-path: studies/chess_single_A_v2/requirements-model.txt
      - run: python -m pip install -r studies/chess_single_A_v2/requirements-model.txt
      - name: Collect all twenty completed training tasks
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: fit-*
          path: collected/runs/
          merge-multiple: false
      - name: Verify the complete model ledger before external scoring
        run: python studies/chess_single_A_v2/evaluate_models.py seal --repo-root . --runs-dir collected/runs --output-dir collected
      - name: Persist sealed models before the evaluation job starts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chess-single-a-v2-sealed-fits
          path: collected/
          if-no-files-found: error
          retention-days: 90

  evaluate:
    needs: seal
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.17'
          cache: pip
          cache-dependency-path: studies/chess_single_A_v2/requirements-model.txt
      - run: python -m pip install -r studies/chess_single_A_v2/requirements-model.txt
      - name: Load only the sealed complete model collection
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: chess-single-a-v2-sealed-fits
          path: sealed/
      - name: Jointly score every prespecified model and size
        run: python studies/chess_single_A_v2/evaluate_models.py evaluate --repo-root . --runs-dir sealed/runs --seal-file sealed/fitted_models_lock.json --output-dir studies/chess_single_A_v2/results
      - name: Preserve a durable training checkpoint with the report
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path('sealed')
          output = pathlib.Path('studies/chess_single_A_v2/results')
          bundle = output / 'training_checkpoint_bundle.zip'
          with zipfile.ZipFile(bundle, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      archive.write(path, path.relative_to(root).as_posix())
          if bundle.stat().st_size >= 50 * 1024 * 1024:
              raise RuntimeError('Checkpoint bundle exceeds the repository size budget; sealed artifacts remain available')
          info = {'file': bundle.name, 'bytes': bundle.stat().st_size, 'sha256': hashlib.sha256(bundle.read_bytes()).hexdigest(), 'sealed_models_lock_sha256': hashlib.sha256((root / 'fitted_models_lock.json').read_bytes()).hexdigest()}
          (output / 'training_checkpoint_bundle.json').write_text(json.dumps(info, indent=2) + '\n')
          print(json.dumps(info))
          PY
      - name: Save the complete result and checkpoint
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chess-single-a-v2-results-${{ github.run_id }}
          path: studies/chess_single_A_v2/results/
          if-no-files-found: warn
          retention-days: 90
      - name: Commit the joint report and preserved fitted models
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- studies/chess_single_A_v2/results/
          if ! git diff --cached --quiet; then
            git commit -m 'Report locked chess A model comparison with fitted-model checkpoint [skip ci]'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Display the joint result
        run: cat studies/chess_single_A_v2/results/REPORT.md >> "$GITHUB_STEP_SUMMARY"
