name: France Academy 2019-2023 first-party PDF source smoke v2

on:
  push:
    branches:
      - france-academy-election-2019-2023-pilot-v2
    paths:
      - scripts/france_academy_elections_2019_2023_source_pilot_v2.py
      - .github/workflows/france_academy_elections_2019_2023_smoke_v2.yml
      - data/france_academy_elections_2019_2023_pilot_v2/source_inventory_v2.csv
      - data/france_academy_elections_2019_2023_pilot_v2/golden_58_official_member_names_v2.csv
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-document-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-text PDF parser
        run: python -m pip install --disable-pip-version-check requests==2.32.3 pymupdf==1.26.5
      - name: Compile and validate 58 first-party electee name references OFFLINE
        run: python -m py_compile scripts/france_academy_elections_2019_2023_source_pilot_v2.py && python scripts/france_academy_elections_2019_2023_source_pilot_v2.py --fixture-check
      - name: Fetch four first-party Academy election PDFs with source hashes
        run: python scripts/france_academy_elections_2019_2023_source_pilot_v2.py --fetch --limit 4 --resume --delay 1.0 --timeout 20 --retries 2
      - name: Source-name and negative-control assertions
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("local_runs/france_academy_elections_2019_2023_v2/summary.json")
          s=json.loads(p.read_text(encoding="utf-8"))
          assert s["regular_pdf_documents_verified"]==4
          assert s["person_names_verified_from_firstparty"]==58
          assert s["person_names_unmatched"]==0
          assert s["foreign_2021_associate_negative_control_excluded"]
          assert s["source_PDF_birthdays_found"]==0
          assert s["bazi_variables_computed"]==0
          PY
      - name: Checkpoint official source URL SHA256 and 58 person-level metadata on working branch
        if: success()
        shell: bash
        run: |
          dest=data/france_academy_elections_2019_2023_pilot_v2/source_validation_v2
          mkdir -p "$dest"
          cp local_runs/france_academy_elections_2019_2023_v2/summary.json "$dest/summary.json"
          cp local_runs/france_academy_elections_2019_2023_v2/source_fetch_audit_v2.csv "$dest/source_fetch_audit_v2.csv"
          cp local_runs/france_academy_elections_2019_2023_v2/candidate_official_member_election_v2.csv "$dest/candidate_official_member_election_v2.csv"
          cp local_runs/france_academy_elections_2019_2023_v2/unmatched_names_v2.csv "$dest/unmatched_names_v2.csv"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          if ! git diff --cached --quiet; then
            git commit -m "Checkpoint four French Academy official 2019–2023 PDF hashes and 58 election records"
            git pull --rebase origin france-academy-election-2019-2023-pilot-v2
            git push origin HEAD:france-academy-election-2019-2023-pilot-v2
          fi
      - name: Archive compact source and unmatched-name audit only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: france-academy-2019-2023-four-source-pilot-v2
          path: |
            local_runs/france_academy_elections_2019_2023_v2/summary.json
            local_runs/france_academy_elections_2019_2023_v2/source_fetch_audit_v2.csv
            local_runs/france_academy_elections_2019_2023_v2/unmatched_names_v2.csv
            local_runs/france_academy_elections_2019_2023_v2/candidate_official_member_election_v2.csv
          if-no-files-found: warn
          retention-days: 30
