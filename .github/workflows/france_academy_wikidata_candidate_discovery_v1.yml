name: France Academy Wikidata identity candidate pilot v1

on:
  push:
    branches:
      - france-academy-source-pilot-v1
    paths:
      - scripts/france_academy_wikidata_candidate_discovery_v1.py
      - .github/workflows/france_academy_wikidata_candidate_discovery_v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wikidata-identity-discovery:
    name: Discover Wikidata P6282 and P463 candidate QIDs, no admissions
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests==2.32.3
      - name: Syntax check
        run: python -m py_compile scripts/france_academy_wikidata_candidate_discovery_v1.py
      - name: Collect source-tagged identity candidates from public Wikidata
        run: python scripts/france_academy_wikidata_candidate_discovery_v1.py --strict
      - name: Summarize candidate year support and missingness without admitting members
        run: python scripts/france_academy_candidate_birthyear_triage_v1.py
      - name: Archive raw SPARQL snapshots and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: france-academy-wikidata-identity-candidates-v1
          path: data/france_academy_wikidata_candidate_discovery_v1/
          if-no-files-found: warn
          retention-days: 90
      - name: Checkpoint candidate-only data and source snapshots on discovery branch
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/france_academy_wikidata_candidate_discovery_v1/
          if ! git diff --cached --quiet; then
            git commit -m "Checkpoint French Academy unverified identity candidates and source snapshots v1"
            git push origin HEAD:france-academy-source-pilot-v1
          else
            echo "No changes to checkpoint"
          fi
