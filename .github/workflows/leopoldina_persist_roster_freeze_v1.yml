name: Persist Leopoldina Roster Freeze v1
on:
  push:
    branches: [leopoldina-roster-probe-v1]
    paths:
      - ".github/workflows/leopoldina_persist_roster_freeze_v1.yml"
permissions:
  contents: write
  actions: read
jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: leopoldina-roster-probe-v1
      - uses: actions/download-artifact@v4
        with:
          name: leopoldina-roster-freeze-v1
          path: /tmp/leopoldina_roster_freeze_v1
          run-id: 38094217464
          github-token: ${{ github.token }}
      - name: Persist frozen roster and checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm -rf data/leopoldina_roster_freeze_v1
          mkdir -p data/leopoldina_roster_freeze_v1
          cp -a /tmp/leopoldina_roster_freeze_v1/. data/leopoldina_roster_freeze_v1/
          cat > LEOPOLDINA_ROSTER_CLOSEOUT_V1.md <<'EOF'
          # Leopoldina Primary Science-Core Roster Closeout v1

          ## Frozen cohort

          The primary Leopoldina science-core roster is frozen before DOB collection and before any hierarchy-study BaZi computation.

          - Classes I-III only.
          - Election/admission year through 2025.
          - International membership is retained; this is an institution-selected academy cohort, not a German-nationality cohort.
          - Class I: 1,131.
          - Class II: 946.
          - Class III: 811.
          - Total: 2,888.
          - Current at source: 1,361.
          - Deceased at source: 1,527.
          - Sections represented: 22.
          - Official member detail pages parsed successfully: 2,888 / 2,888.
          - Election-year mismatches: 0.
          - Section-to-class ambiguities: 0.
          - 2026 members excluded from the first confirmatory freeze: 40.
          - DOB lookup performed during roster definition: 0.
          - BaZi variables computed: 0.

          ## Honorary-membership treatment

          Leopoldina honorary membership is an Academy distinction awarded to existing members rather than a separate route of admission. A later honorary distinction therefore does not remove an otherwise eligible ordinary Member from this cohort.

          ## Reproducibility checkpoint

          URL-inventory workflow run: 38093754128.
          URL-inventory artifact ID: 11684932133.
          URL-inventory artifact ZIP SHA256: a48fe6d9b05a1447b66f1b2f305560f03245fff806895b01f21b21395a1bbf01.

          Detail-roster workflow run: 38094217464.
          Detail-roster artifact ID: 11685836062.
          Detail-roster artifact ZIP SHA256: f149b6fb666f5f944b943a941fe1778baff8b9d0bca48bd87c2f7d8c632eaf53.

          Frozen roster CSV SHA256: 713c8b090df134057adf30e89951f77dc6a3f49f710c54e6413469ecb54c7163.
          Section audit SHA256: 2e28a6aa3f981e44624b9e4c4bccd924008ccef8ce2c1f128df98143b19580bd.

          ## Stop rule

          The roster definition is frozen at v1. Reopen roster membership only for a demonstrable source/provenance error, versioned before hierarchy outcome analysis. DOB collection may now proceed without altering cohort membership.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leopoldina_roster_freeze_v1 LEOPOLDINA_ROSTER_CLOSEOUT_V1.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Freeze Leopoldina primary science-core roster v1"
          git push origin HEAD:leopoldina-roster-probe-v1
