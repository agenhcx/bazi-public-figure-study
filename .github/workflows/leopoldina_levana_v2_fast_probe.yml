name: Leopoldina Levana V2 Fast Probe
on:
  push:
    branches: [leopoldina-dob-official-v1]
    paths:
      - "scripts/leopoldina_levana_v2_fast_probe.py"
      - ".github/workflows/leopoldina_levana_v2_fast_probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/leopoldina_levana_v2_fast_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leopoldina-levana-v2-fast-probe
          path: data/leopoldina_levana_v2_fast_probe_v1/probe.json
