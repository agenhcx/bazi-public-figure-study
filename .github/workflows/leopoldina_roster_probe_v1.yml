name: Leopoldina Roster Probe v1

on:
  push:
    branches: [leopoldina-roster-probe-v1]
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/leopoldina_roster_probe_v1.py"
      - ".github/workflows/leopoldina_roster_probe_v1.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/leopoldina_roster_probe_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: leopoldina-roster-probe-v1
          path: data/leopoldina_roster_probe_v1/probe.json
