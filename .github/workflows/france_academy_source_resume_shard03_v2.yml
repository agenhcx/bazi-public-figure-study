name: France Academy source checkpoint and offline replay
on:
  push:
    branches:
      - france-academy-shard03-grammar-resume-v1-20261019
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned parser dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3
      - name: Check source grammar and stop/resume regressions
        run: |
          python scripts/france_academy_wikisource_election_rows_v1.py --fixture-check
          python scripts/france_academy_wikisource_legacy_election_headings_v1.py --fixture-check
          python scripts/test_france_academy_source_resume_v1.py -v
      - name: Restore checksum-verified source bytes without source requests
        run: python scripts/france_academy_source_cache_bundle_v1.py --restore data/france_academy_shard03_source_snapshot_v1/source_cache_v1.tar.gz
      - name: Replay full Shard03 offline, including persisted HTTP404 responses
        run: python scripts/france_academy_run_remaining_172_toc_batch_v1.py --shard 3 --run --offline --out-root local_runs/france_academy_shard03_ci_replay
      - name: Verify source SHA, event ledger, revisions, and cumulative checkpoint
        run: python scripts/france_academy_update_source_checkpoint_v2.py --revision-dir data/france_academy_shard02_grammar_review_v2 --out local_runs/france_academy_checkpoint_ci_replay
      - name: Compare reproduced checkpoint to committed checkpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          import filecmp
          expected = Path('data/france_academy_source_checkpoint_v2')
          actual = Path('local_runs/france_academy_checkpoint_ci_replay')
          for name in ['cumulative_source_checked_unique_volumes_v2.csv', 'summary.json', 'remaining_source_queue_v2.csv', 'added_or_reparsed_index_events_v2.csv']:
              assert filecmp.cmp(expected/name, actual/name, shallow=False), name
          print('PASS: deterministic checkpoint and full source replay; no source network access')
          PY
