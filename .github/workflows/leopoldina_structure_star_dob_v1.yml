name: Leopoldina Structure Volume Star-DOB Scan v1
on:
  push:
    branches: [leopoldina-dob-official-v1]
    paths:
      - "scripts/leopoldina_structure_star_dob_v1.py"
      - "scripts/leopoldina_structure_star_dob_consolidate_v1.py"
      - ".github/workflows/leopoldina_structure_star_dob_v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        structure_year: [2022,2023,2024,2025]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STRUCTURE_YEAR: ${{ matrix.structure_year }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet pypdf
      - run: python scripts/leopoldina_structure_star_dob_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leopoldina-structure-star-dob-${{ matrix.structure_year }}
          path: |
            data/leopoldina_structure_star_dob_shard_v1/candidates_${{ matrix.structure_year }}.csv
            data/leopoldina_structure_star_dob_shard_v1/summary_${{ matrix.structure_year }}.json
  consolidate:
    needs: collect
    if: needs.collect.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: leopoldina-structure-star-dob-*
          path: data/leopoldina_structure_star_dob_inputs_v1
          merge-multiple: false
      - run: python scripts/leopoldina_structure_star_dob_consolidate_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: leopoldina-structure-star-dob-candidates-v1
          path: data/leopoldina_structure_star_dob_candidates_v1/
