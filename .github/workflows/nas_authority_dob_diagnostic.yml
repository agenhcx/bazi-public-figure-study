name: NAS Authority DOB Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/nas_authority_dob_diagnostic_v1.py'
      - '.github/workflows/nas_authority_dob_diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  authority-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download frozen v11 checkpoint artifact
        uses: actions/download-artifact@v4
        with:
          name: nas-dob-v8-checkpoint
          github-token: ${{ github.token }}
          repository: agenhcx/bazi-public-figure-study
          run-id: 37702487599
          path: data

      - name: Run GND and LOC authority DOB diagnostic
        run: python scripts/nas_authority_dob_diagnostic_v1.py

      - name: Upload diagnostic outputs
        uses: actions/upload-artifact@v4
        with:
          name: nas-authority-dob-diagnostic-v1
          path: |
            data/nas_science_core_dob_crosswalk/nas_authority_dob_diagnostic_v1.csv
            data/nas_science_core_dob_crosswalk/nas_authority_dob_candidates_v1.csv
            data/nas_science_core_dob_crosswalk/nas_authority_dob_validation_conflicts_v1.csv
            data/nas_science_core_dob_crosswalk/summary_authority_dob_diagnostic_v1.json
          if-no-files-found: error
