name: Leopoldina Class-Year Probe v1
on:
  push:
    branches: [leopoldina-roster-probe-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/leopoldina_class_year_probe_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: leopoldina-class-year-probe-v1
          path: data/leopoldina_class_year_probe_v1/probe.json
