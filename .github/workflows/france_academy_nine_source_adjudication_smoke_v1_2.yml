name: France Academy nine-person source adjudication offline smoke v1_2

on:
  push:
    branches:
      - france-cths-nine-person-source-adjudication-v1_2
    paths:
      - scripts/france_academy_cths_nine_source_adjudication_audit_v1_2.py
      - .github/workflows/france_academy_nine_source_adjudication_smoke_v1_2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-ledger-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify script syntax
        run: python -m py_compile scripts/france_academy_cths_nine_source_adjudication_audit_v1_2.py
      - name: Offline source and nine-person identity audit
        run: python scripts/france_academy_cths_nine_source_adjudication_audit_v1_2.py
      - name: Verify no final data acceptance or unblinding
        run: |
          python -c 'import json; r=json.load(open("local_runs/france_academy_cths_nine_source_adjudication_v1_2/summary.json",encoding="utf-8")); assert r["network_requests"]==0 and r["review_people"]==9 and r["evidence_claims"]==29 and r["source_corroborated_DOB_people"]==4 and r["first_party_Academy_full_election_people"]==3 and r["final_frozen_study_DOB_accepted"]==0 and r["bazi_variables_computed"]==0; print("Source QC smoke verified")'
      - name: Archive small summary and unresolved records only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: france-nine-source-adjudication-smoke-v1-2
          path: |
            local_runs/france_academy_cths_nine_source_adjudication_v1_2/summary.json
            local_runs/france_academy_cths_nine_source_adjudication_v1_2/unresolved_status_or_dob_review.csv
          if-no-files-found: warn
          retention-days: 30
