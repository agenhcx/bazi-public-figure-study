name: Chess peak - collection and Shangguan association

on:
  push:
    branches: [codex/chess-single-a-plan-v1]
    paths:
      - 'studies/chess_peak_v1/**'
      - '.github/workflows/chess_peak_acquisition_v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: chess-peak-acquisition-${{ github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'
  MPLBACKEND: Agg
  PEAK_RESUME_RUN_ID: '40043634261'
  PEAK_RESUME_ARTIFACT_NAME: 'peak-acq-checkpoint-1'

jobs:
  acquire_and_describe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.17'
          cache: pip
          cache-dependency-path: studies/chess_single_A_v2/requirements-model.txt
      - run: python -m pip install -r studies/chess_single_A_v2/requirements-model.txt
      - name: Check collection and association implementation on synthetic data
        run: python -m unittest discover -s studies/chess_peak_v1 -p 'test_*.py' -v
      - name: Choose an earlier acquisition checkpoint if retrying
        id: resume
        run: |
          if [ "$PEAK_RESUME_RUN_ID" != 0 ]; then
            echo "run=$PEAK_RESUME_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "artifact=$PEAK_RESUME_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            previous_attempt=$((GITHUB_RUN_ATTEMPT - 1))
            echo "run=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "artifact=peak-acq-checkpoint-$previous_attempt" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore verified responses from an earlier attempt
        if: steps.resume.outputs.run != ''
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.resume.outputs.artifact }}
          run-id: ${{ steps.resume.outputs.run }}
          github-token: ${{ github.token }}
          path: peak_resume
      - name: Collect all 1500 histories and audit historical coverage
        id: collect
        run: python -u studies/chess_peak_v1/prepare_inputs.py --repo-root . --work-dir peak_acquisition --resume peak_resume/acquisition_checkpoint.zip --workers 1 --requests-per-second 0.5 --prefer-provider lichess
      - name: Preserve source checkpoint even on audit failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: peak-acq-checkpoint-${{ github.run_attempt }}
          path: peak_acquisition/checkpoint/
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve completed labels and coverage audits
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chess-peak-prepared-inputs-${{ github.run_id }}
          path: studies/chess_peak_v1/data/
          if-no-files-found: error
          retention-days: 90
      - name: Commit complete inputs before association analysis
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- studies/chess_peak_v1/data/
          if ! git diff --cached --quiet; then
            git commit -m 'Prepare observed peak labels for the fixed disjoint chess cohorts [skip ci]'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Describe fixed Shangguan associations in each cohort
        run: python studies/chess_peak_v1/shangguan_association.py --repo-root . --output-dir studies/chess_peak_v1/shangguan_results
      - name: Preserve association report
        if: steps.collect.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chess-peak-shangguan-${{ github.run_id }}
          path: studies/chess_peak_v1/shangguan_results/
          if-no-files-found: warn
          retention-days: 90
      - name: Commit descriptive report without predictive training
        run: |
          git add -f -- studies/chess_peak_v1/shangguan_results/
          if ! git diff --cached --quiet; then
            git commit -m 'Describe Shangguan association with observed peak Elo in each cohort [skip ci]'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          cat studies/chess_peak_v1/shangguan_results/REPORT.md >> "$GITHUB_STEP_SUMMARY"
