name: Persist Leopoldina Official DOB Crosswalk v1
on:
  push:
    branches: [leopoldina-dob-official-v1]
    paths:
      - "scripts/leopoldina_official_dob_crosswalk_v1.py"
      - ".github/workflows/leopoldina_official_dob_crosswalk_v1.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: leopoldina-dob-official-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/leopoldina_official_dob_crosswalk_v1.py
      - name: Persist official DOB crosswalk
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leopoldina_dob_crosswalk_v1
          git commit -m "Persist Leopoldina official DOB crosswalk v1"
          git push origin HEAD:leopoldina-dob-official-v1
