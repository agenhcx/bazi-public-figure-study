name: Leopoldina P10299 DOB Diagnostic v1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run P10299 exact-DOB diagnostic
        run: python scripts/leopoldina_wikidata_memberid_dob_pilot_v1.py
      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: leopoldina-p10299-dob-diagnostic-v1
          path: data/leopoldina_wikidata_memberid_dob_pilot_v1/
          if-no-files-found: error
